Kekuatan fisik dan ketahananmu melebihi prajurit manapun."},{id:"wong-tani",nama:"Wong Tani",kasta:"Kasta V",level:2,era:"Mataram Kuno - Demak",arti:"Petani padi yang mengolah sawah kerajaan dan memberi makan seluruh kawula.",tugas:"Kau adalah ibu dari peradaban. Dari tanganmu, beras menjadi kehidupan, dan kehidupan menjadi kerajaan."},{id:"peladang",nama:"Peladang",kasta:"Kasta V",level:2,era:"Sriwijaya - Pajajaran",arti:"Pengolah ladang kering, penanam palawija dan umbi di lereng gunung.",tugas:"Kau membaca musim dari arah angin. Kesabaranmu menunggu panen adalah ilmu tertinggi."},{id:"nelayan-laut",nama:"Nelayan Laut",kasta:"Kasta V",level:2,era:"Sriwijaya - Demak",arti:"Penakluk ombak yang mencari ikan dan mutiara untuk kraton.",tugas:"Kau bersahabat dengan badai. Keberanianmu melaut mengajarkan kraton arti batas dan kebebasan."},{id:"petambak-garam",nama:"Petambak Garam",kasta:"Kasta V",level:2,era:"Majapahit - Tuban",arti:"Pembuat garam dari air laut, pengawet makanan seluruh kerajaan.",tugas:"Dari air asin kau ciptakan rasa. Tanpa garam mu, kekuatan prajurit akan rapuh."},{id:"peramu-hutan",nama:"Peramu Hutan",kasta:"Kasta V",level:2,era:"Kutai - Mataram Kuno",arti:"Pengumpul damar, rotan, dan rempah di kedalaman rimba.",tugas:"Kau tahu rahasia akar dan daun. Hutan berbisik padamu, bukan pada raja."},{id:"penebang-kayu",nama:"Penebang Kayu",kasta:"Kasta V",level:2,era:"Majapahit - Mataram Islam",arti:"Penebang jati untuk membangun candi, kraton, dan armada.",tugas:"Setiap pohon yang kau tumbangkan menjadi singgasana. Tanganmu yang kasar membangun kemegahan yang halus."},{id:"peternak",nama:"Peternak",kasta:"Kasta V",level:2,era:"Singasari - Kediri",arti:"Pemelihara kerbau, kuda, dan lembu kraton.",tugas:"Kau memahami bahasa hewan yang tak dimengerti raja. Kelembutanmu menjinakkan yang liar."},{id:"juru-gerabah",nama:"Juru Gerabah",kasta:"Kasta V",level:2,era:"Majapahit - Kasongan",arti:"Pembuat kendi, gentong, dan periuk dari tanah liat.",tugas:"Dari lumpur kau ciptakan wadah kehidupan. Bentukmu sederhana, fungsimu abadi."},{id:"penenun",nama:"Penenun",kasta:"Kasta V",level:2,era:"Sriwijaya - Toraja",arti:"Penenun kain tenun, songket, dan lurik untuk busana rakyat dan bangsawan.",tugas:"Benangmu adalah doa. Setiap helai yang kau silang adalah takdir yang kau rajut."},{id:"pande-besi",nama:"Pande Besi",kasta:"Kasta IV",level:3,era:"Mataram Kuno - Majapahit",arti:"Empu pembuat senjata, cangkul, dan keris dari besi pilihan.",tugas:"Apimu adalah jantung kraton. Kau menempa besi menjadi kehormatan, dan kehormatan menjadi kekuasaan."},{id:"pande-mas",nama:"Pande Mas",kasta:"Kasta IV",level:3,era:"Sriwijaya - Majapahit",arti:"Pengrajin perhiasan emas mahkota dan pusaka raja.",tugas:"Emas luluh di tanganmu menjadi simbol keabadian. Kau membuat kefanaan terlihat abadi."},{id:"pande-perak",nama:"Pande Perak",kasta:"Kasta IV",level:3,era:"Kotagede - Mataram Islam",arti:"Seniman perak yang membuat bokor, wadah sirih, dan hiasan keris.",tugas:"Kilau perakmu menerangi malam selamatan. Detail kecilmu adalah kemewahan yang sesungguhnya."},{id:"undagi",nama:"Undagi",kasta:"Kasta IV",level:3,era:"Mataram Kuno - Majapahit",arti:"Arsitek candi dan kraton, ahli tata ruang kosmis.",tugas:"Kau membangun bukan sekadar bangunan, tapi mandala di bumi. Batumu berbicara tentang surga."},{id:"juru-ukir",nama:"Juru Ukir",kasta:"Kasta IV",level:3,era:"Jepara - Bali Kuno",arti:"Pengukir kayu dan batu dengan motif flora-fauna kraton.",tugas:"Pahatmu menghidupkan kayu mati. Kau memberi jiwa pada benda tak bernyawa."},{id:"sungging",nama:"Sungging",kasta:"Kasta IV",level:3,era:"Majapahit - Wayang",arti:"Pelukis kulit wayang dan hiasan kraton dengan warna alami.",tugas:"Warna-warni mu adalah cerita. Tanpa dirimu, wayang hanya kulit tanpa roh."},{id:"juru-batik",nama:"Juru Batik",kasta:"Kasta IV",level:3,era:"Mataram Islam - Pekalongan",arti:"Pembatik tulis yang menggambar takdir dengan canting dan malam.",tugas:"Setiap titik malam adalah mantra. Kainmu bukan pakaian, tapi peta perjalanan jiwa."},{id:"dalang-wayang",nama:"Dalang Wayang",kasta:"Kasta IV",level:3,era:"Kediri - Mataram Islam",arti:"Sang pencerita, penjaga moral dan sejarah lewat bayangan kulit.",tugas:"Suaramu adalah suara leluhur. Kau menghidupkan dewa dan manusia dalam satu kelir."},{id:"nayaga-gamelan",nama:"Nayaga Gamelan",kasta:"Kasta IV",level:3,era:"Mataram Kuno - Surakarta",arti:"Pemusik gamelan kraton, penjaga irama kosmos.",tugas:"Tabuhanmu mengatur detak jantung kerajaan. Jika kau berhenti, waktu pun berhenti."},{id:"pesinden",nama:"Pesinden",kasta:"Kasta IV",level:3,era:"Majapahit - Mataram Islam",arti:"Penyanyi kraton yang suaranya dipercaya membawa berkah.",tugas:"Suaramu adalah jembatan antara manusia dan hyang. Tangismu bisa menurunkan hujan."},{id:"saudagar-cilik",nama:"Saudagar Cilik",kasta:"Kasta IV",level:3,era:"Demak - Banten",arti:"Pedagang keliling antar desa yang membawa kabar dan barang.",tugas:"Kakimu adalah peta perdagangan. Kau menghubungkan dunia yang tak saling kenal."},{id:"saudagar-besar",nama:"Saudagar Besar",kasta:"Kasta IV",level:3,era:"Sriwijaya - Malaka",arti:"Pedagang kaya penguasa jalur rempah dan sutra.",tugas:"Kau lebih kaya dari adipati. Kapalmu membawa bukan barang, tapi pengaruh."},{id:"syahbandar",nama:"Syahbandar",kasta:"Kasta IV",level:3,era:"Samudra Pasai - Demak",arti:"Kepala pelabuhan, pengatur pajak dan hukum laut.",tugas:"Pelabuhan adalah kraton kedua. Tanpa izinmu, bahkan angin tak boleh berlabuh."},{id:"nakhodha",nama:"Nakhodha",kasta:"Kasta IV",level:3,era:"Sriwijaya - Gowa",arti:"Kapten kapal besar yang memimpin ekspedisi antar pulau.",tugas:"Bintang adalah kompasmu, ombak adalah jalanmu. Kau memimpin tanpa daratan di depan mata."},{id:"mualim",nama:"Mualim",kasta:"Kasta IV",level:3,era:"Demak - Aceh",arti:"Juru mudi dan ahli navigasi bintang, penunjuk arah kapal.",tugas:"Kau membaca langit seperti carik membaca lontar. Kesalahanmu satu derajat bisa menyesatkan ribuan jiwa."},{id:"dukun-tabib",nama:"Dukun Tabib",kasta:"Kasta IV",level:3,era:"Semua Era",arti:"Penyembuh dengan jamu, mantra, dan pengetahuan leluhur.",tugas:"Tanganmu dingin menyembuhkan demam raja. Kau penjaga batas antara hidup dan mati."},{id:"bhayangkara",nama:"Bhayangkara",kasta:"Kasta III",level:4,era:"Majapahit - Gajah Mada",arti:"Pasukan elit pengawal raja, kesatria bayangan yang setia mati.",tugas:"Kau hidup untuk satu nama: Raja. Matimu bukan akhir, tapi awal dari legenda."},{id:"prajurit-tamtama",nama:"Prajurit Tamtama",kasta:"Kasta III",level:4,era:"Semua Kerajaan",arti:"Prajurit infanteri, tulang punggung angkatan perang kraton.",tugas:"Jumlahmu ribuan, suaramu satu. Barisanmu adalah tembok yang tak bisa ditembus musuh."},{id:"prajurit-kuda",nama:"Prajurit Kuda",kasta:"Kasta III",level:4,era:"Mataram Islam - Sumba",arti:"Kavaleri berkuda, penyerang cepat di medan perang.",tugas:"Kau dan kudamu satu jiwa. Kecepatanmu adalah ketakutan musuh sebelum perang dimulai."},{id:"laksamana",nama:"Laksamana",kasta:"Kasta III",level:4,era:"Sriwijaya - Demak",arti:"Panglima armada laut, penguasa selat dan samudera.",tugas:"Laut adalah medan perangmu. Gelombang tunduk pada aba-aba mu."},{id:"senapati",nama:"Senapati",kasta:"Kasta III",level:4,era:"Mataram Islam - Mataram Kuno",arti:"Jenderal perang, perencana strategi dan penakluk wilayah.",tugas:"Pikiranmu adalah peta perang. Satu keputusanmu menentukan hidup seribu prajurit."},{id:"rangga",nama:"Rangga",kasta:"Kasta III",level:4,era:"Kediri - Majapahit",arti:"Pejabat keamanan dan pengatur upacara kraton.",tugas:"Kau menjaga ketertiban sekaligus kesakralan. Tanpa mu, upacara agung bisa jadi kekacauan."},{id:"mantri-bekel",nama:"Mantri Bekel",kasta:"Kasta III",level:4,era:"Mataram Islam - Surakarta",arti:"Kepala desa sekaligus pemungut pajak untuk kraton.",tugas:"Kau adalah perpanjangan tangan raja di pelosok. Suaramu adalah suara kraton di telinga rakyat."},{id:"carik",nama:"Carik",kasta:"Kasta III",level:4,era:"Mataram Kuno - Pajang",arti:"Juru tulis kraton, pencatat prasasti dan pajak.",tugas:"Lontarmu lebih tajam dari keris. Kau menulis sejarah yang akan dibaca seribu tahun lagi."},{id:"juru-bahasa",nama:"Juru Bahasa",kasta:"Kasta III",level:4,era:"Malaka - Banten",arti:"Penerjemah tamu asing, pedagang, dan utusan kerajaan lain.",tugas:"Lidahmu menguasai banyak bahasa. Kau mencegah perang hanya dengan kata-kata."},{id:"pujangga",nama:"Pujangga",kasta:"Kasta III",level:4,era:"Kediri - Surakarta",arti:"Sastrawan kraton, pencipta kakawin dan babad.",tugas:"Kata-katamu abadi. Raja bisa mati, tapi puisimu akan tetap dinyanyikan."},{id:"abdi-dalem",nama:"Abdi Dalem",kasta:"Kasta III",level:4,era:"Yogyakarta - Surakarta",arti:"Pegawai kraton inti yang mengabdi langsung pada Sultan.",tugas:"Kesetiaanmu adalah pusaka. Kau bukan pelayan, kau adalah keluarga kraton."},{id:"resi-begawan",nama:"Resi Begawan",kasta:"Kasta II",level:5,era:"Mataram Kuno - Majapahit",arti:"Pertapa suci, penasehat spiritual raja di gunung dan hutan.",tugas:"Kau meninggalkan dunia untuk menyelamatkan dunia. Raja datang padamu untuk mencari kebenaran."},{id:"wiku-biksu",nama:"Wiku Biksu",kasta:"Kasta II",level:5,era:"Sriwijaya - Sailendra",arti:"Biksu Buddha, penjaga ajaran Dharma di kerajaan.",tugas:"Ketenanganmu adalah obat bagi kerajaan yang bergejolak. Doamu menjaga keseimbangan."},{id:"dharmadyaksa",nama:"Dharmadyaksa",kasta:"Kasta II",level:5,era:"Majapahit - Bali",arti:"Hakim agama tertinggi, pengadil perkara spiritual.",tugas:"Keadilanmu bukan untuk manusia saja, tapi untuk hukum kosmos. Putusanmu ditakuti dewa."},{id:"dharmopapati",nama:"Dharmopapati",kasta:"Kasta II",level:5,era:"Majapahit",arti:"Menteri kehakiman dan keagamaan kerajaan.",tugas:"Kau menimbang dosa dan pahala kerajaan. Tanpa mu, hukum hanya jadi kekuasaan."},{id:"purohita",nama:"Purohita",kasta:"Kasta II",level:5,era:"Kutai - Tarumanegara",arti:"Pendeta kerajaan, pemandu ritual besar dan penobatan.",tugas:"Mantramu membuka gerbang langit. Raja tak sah tanpa berkat darimu."},{id:"juru-kunci-candi",nama:"Juru Kunci Candi",kasta:"Kasta II",level:5,era:"Mataram Kuno - Prambanan",arti:"Penjaga candi dan pengetahuan rahasia leluhur.",tugas:"Kau memegang kunci bukan pintu batu, tapi kunci ingatan kolektif bangsa."},{id:"penghulu-kraton",nama:"Penghulu Kraton",kasta:"Kasta II",level:5,era:"Demak - Mataram Islam",arti:"Pemimpin agama Islam di kraton, penasehat syariat Sultan.",tugas:"Kau menjembatani adat dan wahyu. Fatwamu menenangkan rakyat dan raja."},{id:"ketib-modin",nama:"Ketib Modin",kasta:"Kasta II",level:5,era:"Mataram Islam - Cirebon",arti:"Juru doa dan pengurus masjid agung kraton.",tugas:"Azanmu adalah jam kerajaan. Suaramu membangunkan kerajaan untuk mengingat Tuhan."},{id:"maharaja-sultan",nama:"Maharaja Sultan",kasta:"Kasta I",level:6,era:"Kutai - Mataram Islam",arti:"Raja agung, pusat kosmos, pemegang wahyu dan kekuasaan mutlak.",tugas:"Kau adalah negara. Hidup dan mati kawula ada di ujung lidahmu. Bebanmu bukan mahkota, tapi seluruh semesta."},{id:"ratu-permaisuri",nama:"Ratu Permaisuri",kasta:"Kasta I",level:6,era:"Majapahit - Mataram Islam",arti:"Ratu utama, ibu kerajaan, penyeimbang kekuasaan raja.",tugas:"Kecantikanmu bukan hiasan, tapi senjata politik. Senyummu bisa menyelamatkan kerajaan."},{id:"yuwaraja-putra-mahkota",nama:"Yuwaraja Putra Mahkota",kasta:"Kasta I",level:6,era:"Semua Dinasti",arti:"Calon raja, pewaris tahta yang dididik sejak lahir.",tugas:"Kau lahir bukan untuk hidupmu sendiri, tapi untuk melanjutkan napas kerajaan."},{id:"mahapatih",nama:"Mahapatih",kasta:"Kasta I",level:6,era:"Majapahit - Gajah Mada",arti:"Perdana menteri, tangan kanan raja, penguasa sebenarnya.",tugas:"Raja adalah simbol, kau adalah yang menjalankan. Kerajaan berdiri di atas pikiranmu."},{id:"mahamantri-rakryan",nama:"Mahamantri Rakryan",kasta:"Kasta I",level:6,era:"Mataram Kuno - Kediri",arti:"Dewan menteri tinggi, penasehat inti raja dari kaum brahmana.",tugas:"Kau adalah otak kerajaan. Tanpa restumu, titah raja tak berjalan."},{id:"adipati-bupati",nama:"Adipati Bupati",kasta:"Kasta I",level:6,era:"Majapahit - Mataram Islam",arti:"Raja daerah, penguasa kadipaten di bawah Sultan.",tugas:"Di wilayahmu, kau adalah raja. Kesetiaanmu pada kraton pusat menentukan perdamaian."}],Ui=["Seperti keris ditempa ribuan kali, keahlianmu akan mengasah zaman.","Jangan takut kecil, bahkan Wong Tani lah yang memberi makan seluruh kraton.","Kekuatan bukan di singgasana, tapi di ketulusan mengabdi.","Jika laut menolakmu, jadilah Syahbandar yang menaklukkannya.","Setiap batik punya cerita, setiap langkahmu punya takdir.","Api tak membakar Pande Besi, ia justru menguatkannya.","Jadilah seperti padi, semakin berisi semakin merunduk.","Kraton runtuh, tapi Carik tetap menulis. Itulah keabadian.","Tak perlu menjadi Maharaja untuk mengubah sejarah, cukup jadi Pujangga yang jujur.","Perahu Nelayan lebih berani dari istana, karena ia menantang maut tiap pagi.","Emas bisa dicuri, tapi kepandaian Juru Ukir tak bisa dirampas.","Bhayangkara mati tanpa nama, tapi namanya hidup di setiap keamanan.","Dalang tak pernah terlihat, tapi seluruh cerita ada di tangannya.","Jika kau tersesat, tanyalah Mualim, ia membaca bintang bukan peta.","Wong Tani tak pernah protes, tapi tanpa dia semua protes karena lapar.","Kekuasaan adalah titipan, seperti keris pusaka yang harus kembali ke warangka.","Jangan iri pada Ratu, ia tak bisa tidur nyenyak dengan mahkota di kepala.","Nayaga tak perlu berteriak, tabuhannya didengar seluruh negeri.","Sungging mengajarkan: keindahan butuh kesabaran, bukan kecepatan.","Seorang Dukun Tabib lebih dipercaya dari seribu janji Senapati.","Saudagar Besar kaya karena ia percaya pada risiko, bukan pada kepastian.","Gamelan tak akan indah jika semua memukul keras, seperti hidup.","Juru Batik tahu: malam harus dihilangkan untuk melihat pola sejati.","Resi Begawan pergi ke hutan bukan untuk lari, tapi untuk kembali dengan jawaban.","Laksamana tak takut tenggelam, ia takut kehilangan arah.","Pesinden menangis bukan karena sedih, tapi karena suaranya menyentuh Hyang.","Abdi Dalem bukan budak, ia memilih mengabdi karena cinta, bukan paksaan.","Mahapatih Gajah Mada tak pernah menikah, karena ia menikahi Nusantara.","Kuli Pikul mengajarkan: beban berat bukan alasan berhenti berjalan.","Penebang Kayu tahu kapan harus berhenti, agar hutan tetap hidup.","Juru Gerabah gagal seribu kali, sampai kendi terakhir sempurna.","Penenun sabar, karena ia tahu satu benang putus merusak seluruh kain.","Mantri Bekel dibenci saat menagih, dicinta saat melindungi.","Rangga menjaga gerbang, bukan untuk melarang, tapi untuk memilih siapa pantas masuk.","Purohita tak memberi jawaban, ia memberi mantra agar kau menemukan jawabanmu.","Juru Kunci Candi bukan penjaga batu, tapi penjaga ingatan yang hampir hilang.","Penghulu Kraton menikahkan rakyat, tapi ia sendiri menikah dengan tugas.","Ketib Modin membangunkan kerajaan bukan dengan kentongan, tapi dengan doa.","Yuwaraja belajar kalah sebelum belajar menang, itu adat kraton.","Adipati yang adil lebih dicintai dari Sultan yang jauh.","Mahamantri Rakryan diam, karena ia tahu kata yang salah bisa jadi perang.","Budak Belian bukan hina, ia adalah guru tentang makna kebebasan.","Tawanan Perang membawa pengetahuan musuh, itu hadiah paling mahal.","Peladang membaca awan, bukan ramalan, karena alam tak pernah bohong.","Petambak Garam asin kulitnya, tapi manis budinya.","Peramu Hutan masuk hutan tanpa peta, keluar dengan obat untuk ribuan orang.","Peternak berbicara dengan kerbau, karena manusia kadang terlalu bising.","Pande Mas melelehkan ego seperti emas, baru bisa membentuk keindahan.","Pande Perak detailnya halus, seperti kasih ibu pada anaknya.","Undagi membangun candi tanpa paku, karena kepercayaan lebih kuat dari besi.","Juru Bahasa mencegah perang dengan satu kalimat yang tepat.","Wiku Biksu tertawa dalam diam, karena ia melihat semua adalah sementara.","Dharmadyaksa menghukum bukan karena benci, tapi karena cinta pada dharma.","Dharmopapati menimbang dengan hati, bukan dengan timbangan.","Ratu Permaisuri tersenyum dalam duka, karena ia tahu air matanya bisa jadi banjir politik.","Senapati kalah bukan akhir, tapi jeda untuk menyusun siasat baru.","Bhayangkara tak punya keluarga, karena seluruh kraton adalah keluarganya.","Nakhodha pulang tanpa harta tapi kaya cerita, itu lebih berharga.","Mualim salah membaca satu bintang, tapi ia belajar seribu bintang baru.","Dukun Tabib memberi jamu pahit, karena kesembuhan tak selalu manis.","Carik menulis dengan tinta, tapi dibaca dengan darah generasi berikutnya.","Prajurit Tamtama berbaris rapi, karena kekacauan satu orang bisa membunuh seratus.","Prajurit Kuda jatuh dari kuda, tapi ia naik lagi sebelum musuh tertawa.","Pujangga menulis cinta yang tak berbalas, agar orang lain belajar mencintai dengan benar.","Abdi Dalem mencuci kaki Sultan, bukan karena rendah, tapi karena ia tahu kaki itu lelah menggendong negeri.","Resi Begawan lapar di hutan, tapi kenyang akan pengetahuan.","Jangan mengejar jabatan, kejarlah keahlian, jabatan akan mengejarmu.","Seperti tanah, semakin dalam digali, semakin berharga yang ditemukan.","Keris lurus untuk perang, keris luk untuk doa, kau harus tahu kapan menjadi apa.","Jika kau lelah, ingatlah Nelayan yang tak pernah tahu kapan ikan datang, tapi tetap melaut.","Jabatan hanyalah pakaian, watak adalah tubuhmu.","Majapahit runtuh bukan karena musuh, tapi karena lupa pada Pande Besi yang membuat senjatanya.","Sriwijaya jaya karena Syahbandar jujur, bukan karena kapal banyak.","Mataram Islam kuat karena Ketib Modin dan Prajurit Kuda berjalan beriringan.","Takdir bukan untuk dilawan, tapi untuk dipahami, seperti Juru Batik memahami malam.","Kau bukan siapa kau di masa lalu, kau adalah apa yang kau tempa hari ini.","Gunungan wayang selalu di awal dan akhir, mengingatkan semua berawal dan berakhir sama.","Batik tak jadi dalam sehari, begitu juga keagungan.","Jadilah air, ia keras bisa memecah batu, lembut bisa menghidupi sawah.","Api, Air, Tanah,
